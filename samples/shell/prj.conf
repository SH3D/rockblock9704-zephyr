CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_LOG=y
# One log backend, the shell's: with the UART one as well every line
# printed twice.
CONFIG_LOG_BACKEND_UART=n
CONFIG_RB9704=y
CONFIG_RB9704_SHELL=y
# Long `rb9704 send` lines, typed or pasted.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_CRC=y
