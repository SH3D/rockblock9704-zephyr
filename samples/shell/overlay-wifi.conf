#
# The shell over WiFi, for a board out in the open with power and no USB:
#
#   west build -b stamp_c3 samples/shell -- -DEXTRA_CONF_FILE=overlay-wifi.conf
#
# Once, on the USB console:
#
#   wifi cred add -s "<SSID>" -k 1 -p "<password>"
#
# The board joins that network at every boot after (src/wifi.c), logs its
# address, and `telnet <address>` gives the same shell as the console. There
# is no password on telnet and `rb9704 send` costs airtime: keep it on a
# network you trust.

# --- WiFi -------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
# The ESP32 driver reconnects by itself after the access point drops it.
CONFIG_ESP32_WIFI_STA_RECONNECT=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SHELL=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# --- credentials, kept in flash --------------------------------------------
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- the shell on telnet ----------------------------------------------------
CONFIG_SHELL_BACKEND_TELNET=y
# Character mode and echo negotiated with the client, so line editing and
# history work as on the console. Zephyr's own telnet sample sets it.
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y
CONFIG_SHELL_STACK_SIZE=4096

# --- memory -----------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
