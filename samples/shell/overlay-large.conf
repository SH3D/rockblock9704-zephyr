#
# Messages up to 50000 bytes, for `rbtest large`:
#
#   west build -b stamp_c3 samples/shell -- -DEXTRA_CONF_FILE=overlay-large.conf
#
# Three buffers of this size are kept: the library's MO and MT buffers and
# this module's copy for rb9704_send, about 150 kB in all. On the
# M5Stamp-C3 that fits on the USB console, and with overlay-wifi.conf as
# well it does not: the link overflows by 11 kB. With WiFi, 40000 bytes
# fits (docs/boards/stamp_c3.md).
CONFIG_RB9704_MESSAGE_MAX=50000
